name: Validate

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'astro.config.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifests
        run: npm run validate -- --json

      - name: Build site
        run: npm run build
